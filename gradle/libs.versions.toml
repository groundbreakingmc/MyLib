[versions]
adventure = "4.24.0"
configurate = "4.2.0"
junit = "6.0.3"
jmh = "1.37"

[libraries]
# Minecraft
paper-api = { module = "io.papermc.paper:paper-api", version = "1.21.11-R0.1-SNAPSHOT" }

# Plugins
vault-api = { module = "com.github.MilkBowl:VaultAPI", version = "1.7.1" }
luckperms-api = { module = "net.luckperms:api", version = "5.4" }
worldguard-bukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version = "7.0.5" }
supervanish = { module = "com.github.LeonMangler:SuperVanish", version = "6.2.19" }
placeholderapi = { module = "me.clip:placeholderapi", version = "2.11.6" }

# Mojang
authlib = { module = "com.mojang:authlib", version = "3.13.56" }

# Adventure
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-text-logger-slf4j = { module = "net.kyori:adventure-text-logger-slf4j", version.ref = "adventure" }

# Utilities
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
configurate-hocon = { module = "org.spongepowered:configurate-hocon", version.ref = "configurate" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version = "3.2.2" }
guava = { module = "com.google.guava:guava", version = "33.4.8-jre" }
fastutil = { module = "it.unimi.dsi:fastutil", version = "8.5.16" }
hikaricp = { module = "com.zaxxer:HikariCP", version = "7.0.0" }
typesafe-config = { module = "com.typesafe:config", version = "1.4.3" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }

# Annotations
lombok = { module = "org.projectlombok:lombok", version = "1.18.38" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.0.1" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.23.0" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version = "4.110.0" }

# Benchmarking
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jmh-gradle-plugin = { module = "me.champeau.jmh:jmh-gradle-plugin", version = "0.7.3" }

[plugins]
plugin-yml-bukkit = { id = "net.minecrell.plugin-yml.bukkit", version = "0.6.0" }
